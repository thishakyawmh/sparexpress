<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpareXpress - Request</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
   .header-container-request-center {
    font-weight: 600;
    color: #484848;
    font-size: 60px;    
  }
  .header-container-request-center span {
    color: #1d00fb;   
  }

  .header-container-request-center p {
    font-size: 18px;
    color: #484848;
    font-weight: 400;
    text-align: center;
  }


  .nav-links-request {
    list-style: none;
    display: flex;
    justify-content: center;
    flex-grow: 1;
    gap: 40px;
    
}

.nav-links-request a {
    position: relative;
    text-decoration: none;
    color: #484848;
    font-size: 18px;
    padding-bottom: 5px;
    transition: color 0.3s ease;
}

.nav-links-request a::after {
    content: '';
    position: absolute;
    width: 0;
    height: 2px;
    background-color: #1d00fb;
    left: 50%;
    bottom: 0;
    transition: width 0.4s ease, left 0.4s ease;
}

.nav-links-request a:hover::after {
    width: 100%;
    left: 0;
}

.nav-links-request a:hover {
    color: #1d00fb;
}

.nav-button-request button {
    padding: 10px 25px;
    background: #1d00fb;
    border: none;
    color: white;
    font-size: 16px;
    cursor: pointer;
    border-radius: 8px;
    font-family: Poppins;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.nav-button-request button:hover {
    background: #7396ff;
    color: black;
    transform: scale(1.1);
    box-shadow: 0 8px 12px rgba(0, 0, 0, 0.3);
}

  </style>
</head>
<body>

  <div id="bootingLogo">
    <img src="images/redcar.gif" alt="Loading..." />
  </div>

  <nav class="navbar">
    <div class="logo">
      <img src="images/logo_blue.png" alt="Logo" />
    </div>
    <ul class="nav-links-request">
      <li><a href="index.html">Home</a></li>
      <li><a href="Find-Part.html">Search</a></li>
      <li><a href="About.html">About</a></li>
      <li><a href="Contact Us.html">Contact</a></li>
    </ul>
    <div class="nav-button-request">
      <button id="accountButton"> <i class="fa-solid fa-user"></i> My Account</button>
    </div>
  </nav>

  <header>
    <div class="header-container">
      <div class="header-container-request-center">
        Part<span> Request </span>
        <p>Get the parts you need!</p>
      </div>
    </div>
  </header>

  <body>
    <div class="request-container">
      <form action="#" method="POST">
        <h3>Personal Information</h3>
        <div class="request-grid">
          <div class="request-item">
            <label for="request-id">Request ID</label>
            <input type="text" id="request-id" name="request_id" value="#R0056" readonly>
          </div>
          <div class="request-item">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" required>
          </div>
          <div class="request-item">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div class="request-item">
            <label for="contact">Contact Number</label>
            <input type="tel" id="contact" name="contact" required>
          </div>
        </div>

        <hr>

        <h3>Spare Part Information</h3>
        <div class="request-grid">
          <div class="request-item">
            <label for="vehicle-brand">Vehicle Brand</label>
            <select id="vehicle-brand" name="vehicle_brand" required>
              <option value="">Select Brand</option>
              <option>Toyota</option>
              <option>Honda</option>
              <option>Nissan</option>
              <option>Mitsubishi</option>
              <option>Volkswagen</option>
              <option>Mercedes-Benz</option>
              <option>BMW</option>
              <option>Jeep</option>
              <option>Hyundai</option>
              <option>Kia</option>
              <option>Suzuki</option>
              <option>Subaru</option>
              <option>Ford</option>
              <option>Peugeot</option>
              <option>Renault</option>
              <option>Tata Motors</option>
              <option>Mahindra</option>
              <option>MG</option>
              <option>BYD</option>
              <option>Geely</option>
              <option>Land Rover</option>
              <option>Jaguar</option>
            </select>
          </div>
          <div class="request-item">
            <label for="vehicle-model">Vehicle Model</label>
            <input type="text" id="vehicle-model" name="vehicle_model" required>
          </div>
          <div class="request-item">
            <label for="year">Manufactured Year</label>
            <input type="text" id="year" name="year" required>
          </div>
          <div class="request-item">
            <label for="category">Part Category</label>
            <select id="category" name="category" required>
              <option value="">Select Category</option>
              <option value="engine-powertrain">Engine & Powertrain</option>
              <option value="electrical-lighting">Electrical & Lighting</option>
              <option value="brakes-suspension">Brakes & Suspension</option>
              <option value="body-exterior">Body & Exterior</option>
              <option value="interior-comfort">Interior & Comfort</option>
              <option value="safety-security">Safety & Security</option>
              <option value="fuel-emissions">Fuel & Emissions</option>
              <option value="accessories">Accessories</option>
            </select>
          </div>
          <div class="request-item">
            <label for="part-name">Part Name</label>
            <input type="text" id="part-name" name="part_name" required>
          </div>
          <div class="request-item">
            <label for="image">Image of the part</label>
            <input type="file" id="image" name="image">
          </div>
        </div>

        <br>

        <label for="comments">Additional Comments</label>
        <textarea id="comments" name="comments" rows="4" class="request-textarea"></textarea>

        <div class="request-buttons">
          <button type="submit"><i class="fa-regular fa-paper-plane"></i> Send a Request</button>
          <button type="reset">Clear</button>
        </div>
      </form>
    </div>
  </body>

  <footer>
    <div class="footer-container">
      <div class="footer-sm">
        Follow US
      </div>
      <div class="social-icons">
        <ul class>
          <li><a href="#"><i class="fab fa-facebook-f"></i></a></li>
          <li><a href="#"><i class="fa-brands fa-instagram"></i></a></li>
          <li><a href="#"><i class="fab fa-linkedin-in"></i></a></li>
        </ul>
      </div>
      <hr>
      <div class="footer-copyright">
        <p>Copyright © 2024 ・ SpareXpress ・ All rights reserved ・ <span><a href="#"><i class="fas fa-code"></i> by Thish.</a></span></p>
      </div>
    </div>
  </footer>


  
<!-- Booting logo script -->
<script>
  window.addEventListener("load", function() {
    document.body.classList.add("loading");
  
    setTimeout(function() {
      const bootingLogo = document.getElementById("bootingLogo");
  
      bootingLogo.style.opacity = 0; 
  
      setTimeout(function() {
        bootingLogo.style.display = "none";
        document.body.classList.remove("loading");
      }, 1000); 
    }, 500); 
  });
  </script>

  <script src="script.js"></script>

</body>
</html>
