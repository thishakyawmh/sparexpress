<body>

    <div id="bootingLogo">
        <img src="images/redcar.gif" alt="Loading..." />

    <nav class="navbar">
        <div class="logo">
            <img src="images/logo.png" alt="Logo" />

    <div class="contact-container">

        <div class="contact-left">
            <h2>Contact & Feedback</h2>
            <hr>
            <form>
                <div class="form-group">
                    <input type="text" placeholder="Full Name">
                    <input type="text" placeholder="Contact Number">
                </div>
                <input type="email" placeholder="Email Address">
                <input type="text" placeholder="Subject">
                <textarea placeholder="Message"></textarea>
                <button type="submit">Send Message <i class="fa-solid fa-paper-plane"></i></button>
            </form>
        </div>
    
        <div class="contact-right">
            <h2>Get in Touch</h2>
            <hr>
            <ul>
                <li><i class="fas fa-map-marker-alt"></i> Colombo, Sri Lanka</li>
                <li><i class="fas fa-phone"></i> +94 710 506 202</li>
                <li><i class="fas fa-envelope"></i> SpareXpress@gmail.com</li>
            </ul>
            <img src="images/redcar.gif">
        </div>
        
       </div>

    

    <footer>
        <div class="footer-container">
            <div class="footer-sm">

            </div>

            </div>            
        </div>
    </footer>
    
<!-- Booting logo script -->
<script>
    window.addEventListener("load", function() {
      document.body.classList.add("loading");
    
      setTimeout(function() {
        const bootingLogo = document.getElementById("bootingLogo");
    
        bootingLogo.style.opacity = 0; 
    
        setTimeout(function() {
          bootingLogo.style.display = "none";
          document.body.classList.remove("loading");
        }, 1000); 
      }, 500); 
    });
</script>
    
<script src="script.js"></script>
